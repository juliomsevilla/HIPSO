<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HIPSO · Ver nubes TLS</title>
<link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
<style>
/* Colores de apps/gui/src/theme.rs (LIGHT y DARK): el visor se ve igual que el resto de HIPSO */
:root {
  --header: #E6E9EE; --ribbon: #F6F7F9; --canvas: #DDE1E7; --pane: #F0F2F5;
  --border: #CDD3DB; --text: #1F2430; --weak: #6A7280; --accent: #3B6FE0;
  --selection: #CADBFB; --hover: #E4E8EE;
  color-scheme: light;
}
:root[data-tema="oscuro"] {
  --header: #171B21; --ribbon: #242931; --canvas: #12151A; --pane: #1E232A;
  --border: #343B45; --text: #E6EAEF; --weak: #98A1AD; --accent: #5B8DF6;
  --selection: #26406E; --hover: #2E3540;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--canvas); color: var(--text);
  font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; }
#app { display: flex; flex-direction: column; height: 100%; }
.top { height: 40px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 14px;
  background: var(--header); border-bottom: 1px solid var(--border); }
.top img { height: 20px; display: block; }
.top .doc { color: var(--weak); }
.ribbon { flex: none; display: flex; align-items: stretch; background: var(--ribbon);
  border-bottom: 1px solid var(--border); padding: 6px 8px 0 8px; position: relative; z-index: 5; }
.group { display: flex; flex-direction: column; padding: 0 12px; border-right: 1px solid var(--border); min-height: 74px; }
.group:last-child { border-right: 0; }
.group .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 4px 0; }
.group .row { display: flex; align-items: center; gap: 8px; }
.group .title { text-align: center; color: var(--weak); font-size: 12px; padding: 3px 0 5px; }
select, input[type=number], button {
  font: inherit; color: var(--text); background: var(--ribbon); border: 1px solid var(--border);
  border-radius: 4px; padding: 3px 8px; height: 26px; }
select:hover, button:hover, input[type=number]:hover { background: var(--hover); border-color: var(--accent); }
select:focus, button:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
button.on { background: var(--selection); border-color: var(--accent); }
input[type=number] { width: 70px; }
input[type=range] { width: 130px; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
#stage { position: relative; flex: 1; min-height: 0; background: var(--canvas); }
#potree_render_area { position: absolute; inset: 0; background: var(--canvas); }
.status { height: 26px; flex: none; display: flex; align-items: center; background: var(--header);
  border-top: 1px solid var(--border); color: var(--weak); padding: 0 6px; }
.status span { padding: 0 10px; border-right: 1px solid var(--border); }
.status span:last-child { border-right: 0; }
.hint { position: absolute; right: 12px; top: 8px; color: var(--weak); font-size: 12px; pointer-events: none; }
#cargando { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--weak); }
/* panel de filtros, como los menús desplegables de la cinta de HIPSO */
#filtros { position: absolute; left: 8px; top: 0; z-index: 10; width: 360px; max-height: calc(100% - 12px); overflow: auto;
  background: var(--pane); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; display: none;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
#filtros h4 { margin: 10px 0 6px; font-size: 12px; font-weight: 600; color: var(--weak); }
#filtros h4:first-child { margin-top: 0; }
#filtros .cls { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
#filtros .cls label { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#filtros .sw { width: 11px; height: 11px; border-radius: 2px; flex: none; border: 1px solid var(--border); }
#filtros .rng { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
#filtros .rng span { width: 120px; }
#filtros .acc { display: flex; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <img id="marca" src="./brand/hipso-wordmark.svg" alt="HIPSO">
    <span class="doc" id="nombre">Nubes TLS</span>
  </header>
  <div class="ribbon" id="cinta">
    <div class="group">
      <div class="body">
        <div class="row"><button id="babrir">Abrir nube…</button></div>
      </div>
      <div class="title">Archivo</div>
    </div>
    <div class="group">
      <div class="body">
        <div class="row"><label for="color">Color</label><select id="color"></select></div>
        <div class="row"><label for="tam">Tamaño</label>
          <input id="tam" type="range" min="0.3" max="4" step="0.1" value="0.65"><span id="tamv">0,7</span></div>
        <div class="row"><label for="tmax" title="Tamaño máximo de un punto en pantalla: al acercarte, los puntos cercanos no pasan de aquí y la masa se ve compacta">Máx. cerca</label>
          <input id="tmax" type="range" min="2" max="30" step="1" value="6"><span id="tmaxv">6</span></div>
      </div>
      <div class="title">Visualización</div>
    </div>
    <div class="group">
      <div class="body">
        <div class="row"><button id="bfiltros">Filtros ▾</button></div>
        <div class="row"><button id="bquitar">Quitar filtros</button></div>
      </div>
      <div class="title">Filtros de puntos</div>
    </div>
    <div class="group">
      <div class="body">
        <div class="row"><input id="edl" type="checkbox" checked><label for="edl">Relieve</label>
          <input id="edlv" type="number" min="0.05" max="2" step="0.05" value="0.4"></div>
        <div class="row"><label for="pres">Puntos</label>
          <select id="pres">
            <option value="1000000">1 M</option><option value="2000000">2 M</option>
            <option value="4000000" selected>4 M</option><option value="8000000">8 M</option>
            <option value="16000000">16 M</option></select></div>
      </div>
      <div class="title">Vista 3D</div>
    </div>
    <div class="group">
      <div class="body">
        <div class="row"><button id="ajustar">Extensión completa</button><button id="planta">Planta</button></div>
        <div class="row"><button id="frontal">Frontal</button><button id="lateral">Lateral</button></div>
      </div>
      <div class="title">Navegación</div>
    </div>
  </div>
  <div id="stage">
    <div id="potree_render_area"></div>
    <div class="hint">izq.: girar · der.: mover · rueda: zoom</div>
    <div id="cargando">Cargando nube…</div>
    <div id="filtros"></div>
  </div>
  <footer class="status">
    <span id="s_puntos">—</span><span id="s_z">—</span><span id="s_vis">—</span><span>Herramienta: Zoom</span>
  </footer>
</div>

<script>
// los mensajes de depuración y los errores llegan a la salida de error del programa
function dbg(m) { try { window.ipc.postMessage(String(m)); } catch (e) {} }
window.addEventListener("error", (e) => dbg("error: " + e.message + " @" + e.lineno + " " + (e.filename || "").slice(-60)));
window.addEventListener("unhandledrejection", (e) => dbg("rechazo: " + (e.reason && e.reason.stack || e.reason)));
</script>
<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
<script src="./libs/other/BinaryHeap.js"></script>
<script src="./libs/tween/tween.min.js"></script>
<script src="./libs/proj4/proj4.js"></script>
<script src="./libs/i18next/i18next.js"></script>
<script src="./libs/potree/potree.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const oscuro = q.get("tema") === "oscuro";
  document.documentElement.dataset.tema = oscuro ? "oscuro" : "claro";
  document.getElementById("marca").src = oscuro ? "./brand/hipso-wordmark-blanco.svg" : "./brand/hipso-wordmark.svg";
  if (q.get("titulo")) document.getElementById("nombre").textContent = q.get("titulo");
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString("es-ES");
  const fmt1 = (n) => n.toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const canvas = oscuro ? 0x12151A : 0xDDE1E7;

  // ---- rampas (crates/core/src/view.rs) ----
  const Color = Potree.Gradients.VIRIDIS[0][1].constructor; // THREE.Color, que no es global
  const rampa = (paradas) => paradas.map(([t, c]) => [t, new Color(c[0] / 255, c[1] / 255, c[2] / 255)]);
  const AZUL_ROJO = rampa([[0, [40, 60, 220]], [0.25, [30, 190, 230]], [0.5, [70, 210, 70]], [0.75, [250, 220, 40]], [1, [225, 40, 30]]]);
  const TIERRA = rampa([[0, [40, 90, 60]], [0.25, [120, 150, 70]], [0.5, [200, 180, 100]], [0.75, [160, 110, 70]], [1, [250, 250, 250]]]);
  const ANGULO = rampa([[0, [40, 60, 220]], [0.25, [30, 190, 230]], [0.5, [70, 210, 70]], [0.75, [250, 220, 40]], [1, [225, 40, 30]]]);
  const RETORNO = rampa([[0, [60, 200, 60]], [0.5, [240, 200, 40]], [1, [230, 60, 60]]]);

  // ---- clases de crates/core/src/classes.rs ----
  const CLASES = {
    0: ["Creado, nunca clasificado", [200, 200, 200]], 1: ["Sin clasificar", [150, 150, 150]], 2: ["Suelo", [170, 110, 50]],
    3: ["Vegetación baja", [150, 215, 100]], 4: ["Vegetación media", [60, 175, 60]], 5: ["Vegetación alta", [0, 110, 20]],
    6: ["Edificio", [220, 50, 50]], 7: ["Punto bajo (ruido)", [230, 0, 230]], 8: ["Reservado", [255, 150, 0]],
    9: ["Agua", [40, 100, 230]], 10: ["Ferrocarril", [120, 120, 160]], 11: ["Superficie de carretera", [90, 90, 90]],
    12: ["Solape", [240, 220, 40]], 13: ["Protección de cable", [255, 255, 130]], 14: ["Conductor de cable", [255, 200, 130]],
    15: ["Torre de transmisión", [160, 110, 200]], 16: ["Conector de cable", [110, 110, 70]], 17: ["Tablero de puente", [60, 60, 150]],
    18: ["Ruido alto", [255, 80, 200]], 19: ["Estructura elevada", [0, 170, 170]], 20: ["Suelo ignorado", [120, 80, 40]],
    21: ["Nieve", [235, 245, 255]], 22: ["Exclusión temporal", [200, 120, 120]], 64: ["Tronco", [255, 140, 30]], 65: ["Rama", [90, 200, 90]],
  };

  const nombres = {
    elevacion: "Elevación", tierra: "Elevación (tierra)", viridis: "Elevación (morado a amarillo)",
    classification: "Clasificación", intensity: "Intensidad", "return number": "Retorno", "number of returns": "Número de retornos",
    "scan angle": "Ángulo de barrido", "point source id": "Fuente (pasada)", rgba: "RGB",
    PredInstance_SAT: "Árbol (SAT)", PredInstance_FM: "Árbol (FM)", PredSemantic_SAT: "Semántica (SAT)",
    PredSemantic_FM: "Semántica (FM)", species_id_SAT: "Especie (SAT)", species_id_FM: "Especie (FM)", treeID: "Árbol (treeID)",
  };
  const omitir = new Set(["position", "gps-time", "classification flags", "user data", "Amplitude", "Reflectance",
    "Deviation", "PredScore_FM", "species_prob_SAT", "species_prob_FM"]);

  const viewer = new Potree.Viewer($("potree_render_area"));
  window.viewer = viewer;
  viewer.setEDLEnabled(true);
  viewer.setEDLRadius(1.4);
  viewer.setEDLStrength(0.4);
  viewer.setFOV(60);
  viewer.setPointBudget(4000000);
  viewer.setBackground("none");
  viewer.renderer.setClearColor(canvas, 1);

  // colores de clase de HIPSO en el esquema de Potree
  const esquema = viewer.classifications;
  Object.keys(esquema).forEach((k) => { if (k !== "DEFAULT") esquema[k].visible = true; });
  Object.entries(CLASES).forEach(([k, [n, c]]) => {
    esquema[k] = { visible: true, name: n, color: [c[0] / 255, c[1] / 255, c[2] / 255, 1] };
  });
  esquema.DEFAULT = { visible: true, name: "Otra", color: [0.7, 0.7, 0.7, 1] };

  let pc = null, meta = null, zmin = 0, zmax = 1, arrancado = false;

  // parámetros opcionales de arranque (color, filtros, cámara), que usa la ventana al abrirse
  function arrancar() {
    if (arrancado || !pc || !meta) return;
    arrancado = true;
    const c = q.get("color");
    if (c && [...$("color").options].some((o) => o.value === c)) { $("color").value = c; aplicarColor(c); }
    if (q.get("filtros") === "1") { $("filtros").style.display = "block"; $("bfiltros").classList.add("on"); }
    const cam = q.get("cam");
    if (cam) setTimeout(() => {
      const v = cam.split(",").map(Number), p = viewer.scene.view.position;
      if (q.get("fp") === "1") viewer.setControls(viewer.fpControls);
      const V = p.constructor;
      viewer.scene.view.position.set(pc.position.x + v[0], pc.position.y + v[1], pc.position.z + v[2]);
      viewer.scene.view.lookAt(new V(pc.position.x + v[3], pc.position.y + v[4], pc.position.z + v[5]));
    }, 2500);
    // ajustes de prueba del tamaño de punto
    const m = pc.material;
    if (q.get("mns")) viewer.setMinNodeSize(+q.get("mns"));
    if (q.get("tam")) m.size = +q.get("tam");
    if (q.get("maxs")) m.uniforms.maxSize.value = +q.get("maxs");
    if (q.get("mins")) m.minSize = +q.get("mins");
    if (q.get("pres")) viewer.setPointBudget(+q.get("pres"));
    if (q.get("tipo")) m.pointSizeType = Potree.PointSizeType[q.get("tipo")];
    dbg("arranque listo");
  }
  const attr = (n) => meta && meta.attributes.find((a) => a.name === n);

  function aplicarColor(clave) {
    if (!pc) return;
    const m = pc.material;
    if (clave === "elevacion" || clave === "tierra" || clave === "viridis") {
      m.activeAttributeName = "elevation";
      m.gradient = clave === "elevacion" ? AZUL_ROJO : clave === "tierra" ? TIERRA : Potree.Gradients.VIRIDIS;
      m.elevationRange = [zmin, zmax];
      return;
    }
    m.activeAttributeName = clave;
    const a = attr(clave);
    if (clave === "intensity") {
      m.gradient = Potree.Gradients.GRAYSCALE;
      if (a) m.intensityRange = [a.min[0], a.max[0]];
    } else if (clave === "scan angle") {
      m.gradient = ANGULO;
      m.setRange && m.setRange(clave, [-30, 30]);
    } else if (clave === "return number" || clave === "number of returns") {
      m.gradient = RETORNO;
    } else if (clave !== "classification" && clave !== "rgba") {
      m.gradient = Potree.Gradients.SPECTRAL;
    }
  }

  // ---- filtros ----
  const estado = { clases: new Set(Object.keys(CLASES).map(Number)), ret: [0, 7], nret: [0, 7], fuente: null, z: null };
  let volumen = null;
  function aplicarFiltros() {
    Object.keys(CLASES).forEach((k) => viewer.setClassificationVisibility(+k, estado.clases.has(+k)));
    viewer.setFilterReturnNumberRange(estado.ret[0], estado.ret[1]);
    viewer.setFilterNumberOfReturnsRange(estado.nret[0], estado.nret[1]);
    const f = attr("point source id");
    viewer.setFilterPointSourceIDRange(...(estado.fuente || [0, 65535]));
    if (volumen) { viewer.scene.removeVolume(volumen); volumen = null; }
    if (estado.z) {
      const b = pc.pcoGeometry.tightBoundingBox || pc.boundingBox;
      const [x0, y0, x1, y1] = [pc.position.x - 1e4, pc.position.y - 1e4, pc.position.x + 1e4, pc.position.y + 1e4];
      volumen = new Potree.BoxVolume();
      volumen.position.set((x0 + x1) / 2, (y0 + y1) / 2, (estado.z[0] + estado.z[1]) / 2);
      volumen.scale.set(x1 - x0, y1 - y0, Math.max(0.01, estado.z[1] - estado.z[0]));
      volumen.clip = true;
      volumen.visible = false;
      viewer.scene.addVolume(volumen);
      viewer.setClipTask(Potree.ClipTask.SHOW_INSIDE);
      viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);
    } else {
      viewer.setClipTask(Potree.ClipTask.NONE);
    }
  }

  function construirFiltros() {
    const cont = $("filtros");
    const cls = Object.entries(CLASES).map(([k, [n, c]]) =>
      `<label title="${n}"><input type="checkbox" data-c="${k}" checked><span class="sw" style="background:rgb(${c})"></span>${k} · ${n}</label>`).join("");
    const rng = (id, tit, lo, hi, vlo, vhi) =>
      `<div class="rng"><span>${tit}</span>Desde <input type="number" id="${id}0" min="${lo}" max="${hi}" value="${vlo}">
       hasta <input type="number" id="${id}1" min="${lo}" max="${hi}" value="${vhi}"></div>`;
    const z0 = Math.floor(zmin), z1 = Math.ceil(zmax);
    cont.innerHTML = `<h4>Clases</h4><div class="cls">${cls}</div>
      <div class="acc"><button id="ctodas">Todas</button><button id="cninguna">Ninguna</button></div>
      <h4>Retornos</h4>${rng("fr", "N.º de retorno", 0, 15, 0, 7)}${rng("fn", "N.º de retornos", 0, 15, 0, 7)}
      <h4>Cota</h4>${rng("fz", "Cota Z (m)", z0 - 100, z1 + 100, z0, z1)}
      <h4>Fuente</h4>${rng("ff", "Fuente (pasada)", 0, 65535, 0, 65535)}`;
    cont.querySelectorAll("input[data-c]").forEach((i) => i.onchange = () => {
      i.checked ? estado.clases.add(+i.dataset.c) : estado.clases.delete(+i.dataset.c);
      aplicarFiltros();
    });
    const marcar = (v) => { cont.querySelectorAll("input[data-c]").forEach((i) => { i.checked = v; });
      estado.clases = v ? new Set(Object.keys(CLASES).map(Number)) : new Set(); aplicarFiltros(); };
    $("ctodas").onclick = () => marcar(true);
    $("cninguna").onclick = () => marcar(false);
    const par = (id, f) => { const a = $(id + "0"), b = $(id + "1"); const h = () => { f(+a.value, +b.value); aplicarFiltros(); }; a.onchange = h; b.onchange = h; };
    par("fr", (a, b) => { estado.ret = [a, b]; });
    par("fn", (a, b) => { estado.nret = [a, b]; });
    par("fz", (a, b) => { estado.z = (a <= z0 && b >= z1) ? null : [a, b]; });
    par("ff", (a, b) => { estado.fuente = (a <= 0 && b >= 65535) ? null : [a, b]; });
  }

  $("bfiltros").onclick = () => {
    const p = $("filtros");
    const abierto = p.style.display === "block";
    p.style.display = abierto ? "none" : "block";
    $("bfiltros").classList.toggle("on", !abierto);
  };
  $("bquitar").onclick = () => {
    estado.clases = new Set(Object.keys(CLASES).map(Number)); estado.ret = [0, 7]; estado.nret = [0, 7];
    estado.fuente = null; estado.z = null; construirFiltros(); aplicarFiltros();
  };

  window.progreso = (t) => { const c = $("cargando"); if (c) { c.textContent = t; c.style.display = "block"; } };
  // sin la ventana de HIPSO (en una web) no hay con qué elegir un archivo: se oculta el grupo
  if (window.ipc) $("babrir").onclick = () => dbg("abrir");
  else $("babrir").closest(".group").style.display = "none";
  fetch("data/metadata.json").then((r) => { if (!r.ok) throw new Error("sin nube"); return r.json(); }).then((m) => {
    meta = m;
    const pos = attr("position");
    zmin = pos.min[2]; zmax = pos.max[2];
    $("s_puntos").textContent = fmt(m.points) + " puntos";
    $("s_z").textContent = "Z " + fmt1(zmin) + " – " + fmt1(zmax) + " m";
    const sel = $("color");
    const claves = ["elevacion", "tierra", "viridis"];
    m.attributes.forEach((a) => { if (!omitir.has(a.name)) claves.push(a.name); });
    const vistos = new Set();
    claves.forEach((k) => { if (vistos.has(k)) return; vistos.add(k);
      const o = document.createElement("option"); o.value = k; o.textContent = nombres[k] || k; sel.appendChild(o); });
    sel.onchange = () => aplicarColor(sel.value);
    construirFiltros();
    arrancar();
    cargarNube();
  }).catch(() => progreso("Sin nube: pulsa «Abrir nube…» y elige un LAS o LAZ."));

  function cargarNube() { Potree.loadPointCloud("data/metadata.json", "nube", (e) => {
    pc = e.pointcloud;
    const m = pc.material;
    m.size = 0.65;
    m.minSize = 1;
    m.uniforms.maxSize.value = 6;
    m.pointSizeType = Potree.PointSizeType.ADAPTIVE;
    m.shape = Potree.PointShape.SQUARE;
    viewer.scene.addPointCloud(pc);
    aplicarColor("elevacion");
    viewer.fitToScreen();
    $("cargando").remove();
    dbg("nube cargada");
    arrancar();
  }); }

  $("tam").oninput = () => { $("tamv").textContent = (+$("tam").value).toLocaleString("es-ES", { minimumFractionDigits: 1 });
    if (pc) pc.material.size = +$("tam").value; };
  $("tmax").oninput = () => { $("tmaxv").textContent = $("tmax").value;
    if (pc) pc.material.uniforms.maxSize.value = +$("tmax").value; };
  const edl = () => { viewer.setEDLEnabled($("edl").checked); viewer.setEDLStrength(+$("edlv").value || 0.4); };
  $("edl").onchange = edl; $("edlv").onchange = edl;
  $("pres").onchange = () => viewer.setPointBudget(+$("pres").value);
  $("ajustar").onclick = () => viewer.fitToScreen();
  $("planta").onclick = () => viewer.setTopView();
  $("frontal").onclick = () => viewer.setFrontView();
  $("lateral").onclick = () => viewer.setLeftView();

  setInterval(() => {
    if (!pc) return;
    let n = 0; (pc.visibleNodes || []).forEach((v) => { n += (v.geometryNode && v.geometryNode.numPoints) || 0; });
    $("s_vis").textContent = fmt(n) + " puntos mostrados";
  }, 500);
})();
</script>
